<style>

}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg-top: #1a2431;
  --bg-bottom: #0a0f15;
  --ink: #e6ecf1;
  --ink-2: #a9b5c0;
  --ink-3: #7f8c98;
  --panel: rgba(19, 27, 37, 0.72);
  --panel-solid: #16202b;

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  color: var(--ink);

:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

#scene {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: grab;
}

/* ---------- overlay layout ---------- */

.panel {

}

/* ---------- intro ---------- */

.intro a, .intro details { pointer-events: auto; }

.how { margin-top: 12px; color: var(--ink-2); font-size: 13.5px; }

  color: var(--ink);

.src-link {

.tools { grid-area: tools; justify-self: end; display: flex; gap: 8px; align-items: center; }

}
.seg button:hover { color: var(--ink); background: var(--chip-hover); }

.text-btn {

.text-btn:hover { text-decoration-color: currentColor; }
.table-wrap {

  border-radius: 10px;

}
.table-wrap table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.table-wrap th, .table-wrap td { padding: 5px 7px; text-align: right; white-space: nowrap; }

.tags { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.tag {

  align-items: center;

/* ---------- compact layout: phones, and tablets held upright ---------- */
.summary-line { display: none; margin: 2px 0 0; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

<body>
<canvas id="scene" tabindex="0" role="img" aria-label="3D chart of candidates"></canvas>
<div class="tags" aria-hidden="true">
  <div class="tag tag-fetch" id="tagFetch"><span class="key key-fetch"></span><span></span></div>
  <div class="tag tag-risk" id="tagRisk"><span class="key"></span><span></span></div>
  <div class="tag tag-thr" id="tagThr"><span class="key key-pass"></span><span></span></div>
</div>

<div class="hud">
  <header class="intro">

// ===================================================================
// Mechanism (same logic and same random stream as multi-dimensional-choices.py)
// ===================================================================
// @core-begin
// Python-compatible random (MT19937 + random.Random's int seeding, getrandbits,
// _randbelow, randint, choice), so a given --num-elements / --seed pair
// produces exactly the same candidates and the same fetch as the Python script.
const MT_N = 624, MT_M = 397;
class PyRandom {
  constructor(seed) { this.mt = new Uint32Array(MT_N); this.index = MT_N + 1; this.seed(seed); }
  seed(a) {
    let n = Math.abs(Math.trunc(Number(a) || 0));
    const key = [];
    if (n === 0) key.push(0);
    while (n > 0) { key.push(n % 4294967296); n = Math.floor(n / 4294967296); }
    this.initByArray(key);
  }
  initGenrand(s) {
    const mt = this.mt;
    mt[0] = s >>> 0;
    for (let i = 1; i < MT_N; i++) {
      const prev = mt[i - 1] ^ (mt[i - 1] >>> 30);
      mt[i] = (Math.imul(1812433253, prev) + i) >>> 0;
    }
    this.index = MT_N;
  }
  initByArray(key) {
    const mt = this.mt;
    this.initGenrand(19650218);
    let i = 1, j = 0;
    for (let k = Math.max(MT_N, key.length); k > 0; k--) {
      const prev = mt[i - 1] ^ (mt[i - 1] >>> 30);
      mt[i] = ((mt[i] ^ Math.imul(prev, 1664525)) + key[j] + j) >>> 0;
      i++; j++;
      if (i >= MT_N) { mt[0] = mt[MT_N - 1]; i = 1; }
      if (j >= key.length) j = 0;
    }
    for (let k = MT_N - 1; k > 0; k--) {
      const prev = mt[i - 1] ^ (mt[i - 1] >>> 30);
      mt[i] = ((mt[i] ^ Math.imul(prev, 1566083941)) - i) >>> 0;
      i++;
      if (i >= MT_N) { mt[0] = mt[MT_N - 1]; i = 1; }
    }
    mt[0] = 0x80000000;
  }
  uint32() {
    const mt = this.mt;
    let y;
    if (this.index >= MT_N) {
      let kk = 0;
      for (; kk < MT_N - MT_M; kk++) {
        y = (mt[kk] & 0x80000000) | (mt[kk + 1] & 0x7fffffff);
        mt[kk] = mt[kk + MT_M] ^ (y >>> 1) ^ ((y & 1) ? 0x9908b0df : 0);
      }
      for (; kk < MT_N - 1; kk++) {
        y = (mt[kk] & 0x80000000) | (mt[kk + 1] & 0x7fffffff);
        mt[kk] = mt[kk + (MT_M - MT_N)] ^ (y >>> 1) ^ ((y & 1) ? 0x9908b0df : 0);
      }
      y = (mt[MT_N - 1] & 0x80000000) | (mt[0] & 0x7fffffff);
      mt[MT_N - 1] = mt[MT_M - 1] ^ (y >>> 1) ^ ((y & 1) ? 0x9908b0df : 0);
      this.index = 0;
    }
    y = mt[this.index++];
    y ^= y >>> 11;
    y ^= (y << 7) & 0x9d2c5680;
    y ^= (y << 15) & 0xefc60000;
    y ^= y >>> 18;
    return y >>> 0;
  }
  getrandbits(k) { return this.uint32() >>> (32 - k); }
  randbelow(n) {
    const k = 32 - Math.clz32(n);
    let r = this.getrandbits(k);
    while (r >= n) r = this.getrandbits(k);
    return r;
  }
  randint(a, b) { return a + this.randbelow(b - a + 1); }
  choice(seq) { return seq[this.randbelow(seq.length)]; }
}

function averageSquaredDistance(values, center) {
  let total = 0;
  for (const value of values) total += (value - center) ** 2;
  return total / values.length;
}

// Port of wanted_threshold(): split the sorted middle values into a low and a
// high group, then use the mean of the high group as the wanted threshold.
function wantedThreshold(values) {
  const ordered = [...values].sort((a, b) => a - b);
  if (ordered.length < 4 || new Set(ordered).size === 1) return ordered[0];
  const minimum = ordered[0];
  const maximum = ordered[ordered.length - 1];
  const middle = ordered.slice(1, -1);
  if (middle.length < 2) return minimum;
  let bestSplit = 0, bestValue = Infinity;
  for (let split = 0; split < middle.length - 1; split++) {
    const value = averageSquaredDistance(middle.slice(0, split + 1), minimum)
      + averageSquaredDistance(middle.slice(split + 1), maximum);
    if (value < bestValue) { bestValue = value; bestSplit = split; }
  }
  const higherHalf = middle.slice(bestSplit + 1);
  return higherHalf.reduce((sum, value) => sum + value, 0) / higherHalf.length;
}

// Port of choose_candidate(): wanted filter first, then the smallest squared
// distance to the ideal point (maximum wanted, zero unwanted risk).
function chooseCandidate(wanted, unwanted, rng) {
  const threshold = wantedThreshold(wanted);
  let considered = [];
  wanted.forEach((value, id) => { if (value >= threshold) considered.push(id); });
  const maxWanted = Math.max(...wanted);
  if (!considered.length) considered = wanted.flatMap((v, id) => (v === maxWanted ? [id] : []));
  const distance = new Map();
  let best = Infinity;
  for (const id of considered) {
    const d = (maxWanted - wanted[id]) ** 2 + unwanted[id] ** 2;
    distance.set(id, d);
    if (d < best) best = d;
  }
  const finalists = considered.filter((id) => distance.get(id) === best);
  const fetch = rng.choice(finalists);
  return { fetch, considered, threshold, finalists, distance, maxWanted, best };
}

function generateScores(numElements, seed) {
  const rng = new PyRandom(seed);
  const wanted = Array.from({ length: numElements }, () => rng.randint(0, 50));
  const unwanted = Array.from({ length: numElements }, () => rng.randint(0, 50));
  return { wanted, unwanted, rng };
}

function runMechanism(numElements, seed) {
  const { wanted, unwanted, rng } = generateScores(numElements, seed);
  return { wanted, unwanted, ...chooseCandidate(wanted, unwanted, rng) };
}
// @core-end

// ===================================================================
// Data sets
// ===================================================================
// 12 / seed 7 and 100 / seed 42 reproduce the two original Plotly files exactly.
const PRESETS = [
  { n: 5, cols: 5, seed: 14, kind: 'sample' },
  { n: 12, cols: 4, seed: 7, kind: 'demo' },
  { n: 36, cols: 6, seed: 15, kind: 'sample' },
  { n: 100, cols: 10, seed: 42, kind: 'interactive' },
  { n: 400, cols: 20, seed: 3, kind: 'sample' }
];
const DEFAULT_PRESET = PRESETS[3];
const VALUE_MAX = 50;

const state = { n: DEFAULT_PRESET.n, cols: DEFAULT_PRESET.cols, seed: DEFAULT_PRESET.seed, kind: DEFAULT_PRESET.kind, result: null };

(function readUrl() {
  const params = new URLSearchParams(location.search);
  const n = parseInt(params.get('n'), 10);
  if (!Number.isFinite(n) || n < 1 || n > 900) return;
  const preset = PRESETS.find((p) => p.n === n);
  const seedText = params.get('seed');
  state.n = n;
  state.cols = preset ? preset.cols : Math.ceil(Math.sqrt(n));
  if (seedText !== null && /^\d{1,15}$/.test(seedText)) {
    state.seed = Number(seedText);
    state.kind = preset && preset.seed === state.seed ? preset.kind : 'random';
  } else if (preset) {
    state.seed = preset.seed;
    state.kind = preset.kind;
  } else {
    state.seed = 1;
    state.kind = 'random';
  }
})();

function compute() {
  const r = runMechanism(state.n, state.seed);
  const status = new Uint8Array(state.n);
  for (const id of r.considered) status[id] = 1;
  status[r.fetch] = 2;
  const ranking = [...r.considered].sort((a, b) =>
    (r.distance.get(a) - r.distance.get(b)) || ((b === r.fetch) - (a === r.fetch)) || (a - b));
  const rank = new Map(ranking.map((id, index) => [id, index + 1]));
  state.result = { ...r, status, ranking, rank, maxUnwanted: Math.max(...r.unwanted) };
}

function syncUrl() {
  const params = new URLSearchParams(location.search);
  params.set('n', String(state.n));
  params.set('seed', String(state.seed));
  history.replaceState(null, '', `${location.pathname}?${params.toString()}${location.hash}`);
}

  document.querySelectorAll('[data-i18n]').forEach((node) => { node.textContent = t(node.dataset.i18n); });

function renderResult() {
  const r = state.result;
  const fetch = r.fetch;
  els.fetchId.textContent = `#${fetch}`;
  els.statWanted.innerHTML = `<b>${r.wanted[fetch]}</b>${t('ofMax', { v: r.maxWanted })}`;
  els.statRisk.innerHTML = `<b>${r.unwanted[fetch]}</b>${t('ofMax', { v: r.maxUnwanted })}`;
  els.statDistance.innerHTML = `<b>${fmtInt(r.best)}</b>${t('toIdeal', { w: r.maxWanted })}`;
  els.statThreshold.innerHTML = `<b>${fmtThreshold(r.threshold)}</b>`;
  els.statPassed.innerHTML = `<b>${r.considered.length}</b>${t('passedOf', { n: state.n })}`;
  els.statTies.textContent = r.finalists.length > 1
    ? t('tiesList', { list: r.finalists.join(lang === 'zh' ? '、' : ', ') })
    : t('tiesNone');
  els.summaryLine.innerHTML = t('summary', { w: r.wanted[fetch], u: r.unwanted[fetch], p: r.considered.length, n: state.n });
  const sourceKey = { demo: 'srcDemo', interactive: 'srcInteractive', sample: 'srcSample', random: 'srcRandom' }[state.kind];
  els.sourceLine.textContent = t(sourceKey, { s: state.seed });
  els.pyCmd.textContent = `python multi-dimensional-choices.py --num-elements ${state.n} --columns ${state.cols} --seed ${state.seed} --no-show`;
  els.canvas.setAttribute('aria-label', t('canvasLabel', { n: state.n }));
  els.countSeg.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.n) === state.n)));
  if (!els.tableWrap.hidden) renderTable();
  els.tableBtn.textContent = els.tableWrap.hidden ? t('showTable') : t('hideTable');
}

function renderTable() {
  const r = state.result;
  const order = [...r.ranking, ...r.wanted.map((_, id) => id).filter((id) => !r.status[id]).sort((a, b) => (r.wanted[b] - r.wanted[a]) || (a - b))];
  const frag = document.createDocumentFragment();
  for (const id of order) {
    const st = r.status[id];
    const tr = document.createElement('tr');
    if (st === 2) tr.className = 'is-fetch';
    const keyClass = st === 2 ? 'key-fetch' : st === 1 ? 'key-pass' : 'key-other';
    const stage = st === 2 ? t('stageFetch') : st === 1 ? t('stagePass') : t('stageOther');
    const dist = st ? fmtInt(r.distance.get(id)) : '—';
    tr.innerHTML = `<td><span class="key ${keyClass}"></span>${id}</td><td>${r.wanted[id]}</td><td>${r.unwanted[id]}</td><td>${stage}</td><td>${dist}</td>`;
    frag.append(tr);
  }
  els.tableBody.replaceChildren(frag);
  els.tableCaption.textContent = t('tableCaption', { n: state.n });
}

let scene3d = null;

const SCENE_THEMES = {
  light: {
    fetch: '#d21f45', pass: '#cc9f1a', other: '#30a08c',
    bg: ['#f2f5f8', '#e4e9ee', '#b7c3cf'],
    deep: '#283e55', deepAmount: 0.42,
    plate: '#f4f8fb', attenuation: '#d3e3ee', plateRough: 0.2,
    shadow: 0.2, sheetOpacity: 0.1,
    hemiSky: '#ffffff', hemiGround: '#3f5469', hemi: 0.6,
    key: 3.1, keyColor: '#fffaf3', under: 0.5, underColor: '#c3d5f5', env: 0.4,
    lines: '#16202a', linesOpacity: 0.05, edge: '#ffffff', edgeOpacity: 0.9
  },
  dark: {
    fetch: '#ef4f6c', pass: '#b5891a', other: '#0f9a80',
    bg: ['#202b39', '#151d27', '#070b10'],
    deep: '#03070c', deepAmount: 0.55,
    plate: '#8ea3b5', attenuation: '#567186', plateRough: 0.24,
    shadow: 0.34, sheetOpacity: 0.13,
    hemiSky: '#c7d4e1', hemiGround: '#0b1522', hemi: 0.5,
    key: 3.0, keyColor: '#fff6ec', under: 0.4, underColor: '#7f9fd8', env: 0.32,
    lines: '#e6ecf1', linesOpacity: 0.05, edge: '#c3d1de', edgeOpacity: 0.34
  }
};

const VIEWS = {
  angle: { theta: 0.66, phi: 1.1 },
  side: { theta: 0.0, phi: Math.PI / 2 - 0.035 },
  top: { theta: 0.0, phi: 0.0008 },
  below: { theta: 0.66, phi: Math.PI - 0.98 }
};

const CELL = 1;
const BAR_W = 0.74;
const BAR_RADIUS = 0.075;
const BAR_BASE_H = BAR_RADIUS * 2 + 0.02;
const MIN_BAR_H = 0.035;
const PLATE_T = 0.06;
const PLATE_MARGIN = 0.48;

// reveal timeline (ms)
const TL = { grow: 620, stagger: 380, sheet: 980, sheetDur: 520, pass: 1420, passDur: 300, fetch: 1880, fetchDur: 360, label: 2060, end: 2900 };

const clamp01 = (v) => Math.min(1, Math.max(0, v));
const easeOutCubic = (v) => 1 - Math.pow(1 - v, 3);
const easeInOutCubic = (v) => (v < 0.5 ? 4 * v * v * v : 1 - Math.pow(-2 * v + 2, 3) / 2);
const smooth = (v) => v * v * (3 - 2 * v);

async function initScene() {
  let THREE, OrbitControls, RoomEnvironment, RoundedBoxGeometry;
  try {
    THREE = await import('three');
    [{ OrbitControls }, { RoomEnvironment }, { RoundedBoxGeometry }] = await Promise.all([
      import('three/addons/controls/OrbitControls.js'),
      import('three/addons/environments/RoomEnvironment.js'),
      import('three/addons/geometries/RoundedBoxGeometry.js')
    ]);
  } catch (error) {
    console.error(error);
    showSceneError();
    return null;
  }

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: els.canvas, antialias: true, powerPreference: 'high-performance' });
  } catch (error) {
    console.error(error);
    showSceneError();
    return null;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 800);

  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  pmrem.dispose();

  // Screen-space backdrop: drawn inside the renderer so the glass plate can refract it.
  const bgCanvas = document.createElement('canvas');
  bgCanvas.width = 8;
  bgCanvas.height = 512;
  const bgTexture = new THREE.CanvasTexture(bgCanvas);
  bgTexture.colorSpace = THREE.SRGBColorSpace;
  scene.background = bgTexture;

  const hemi = new THREE.HemisphereLight(0xffffff, 0x445566, 1);
  scene.add(hemi);
  const keyLight = new THREE.DirectionalLight(0xffffff, 2);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(2048, 2048);
  keyLight.shadow.bias = -0.00035;
  keyLight.shadow.normalBias = 0.025;
  scene.add(keyLight, keyLight.target);
  const underLight = new THREE.DirectionalLight(0xffffff, 0.5);
  scene.add(underLight, underLight.target);

  // ---------- materials ----------
  const DISPLACE = /* glsl */`
    float hBar = max(aHeight, 0.0);
    float sideSign = position.y > 0.0 ? 1.0 : -1.0;
    float squash = min(hBar / uBaseH, 1.0);
    transformed.y = position.y * squash + sideSign * 0.5 * max(hBar - uBaseH, 0.0) + uDir * 0.5 * hBar;
  `;

  function makeBarMaterial(dir) {
    const uniforms = {
      uBaseH: { value: BAR_BASE_H },
      uDir: { value: dir },
      uDeep: { value: new THREE.Color() },
      uDeepAmount: { value: 0.3 },
      uDepthRange: { value: 4 }
    };
    const material = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      roughness: dir > 0 ? 0.34 : 0.48,
      metalness: 0,
      clearcoat: dir > 0 ? 0.5 : 0.18,
      clearcoatRoughness: 0.28,
      specularIntensity: 0.7
    });
    material.userData.uniforms = uniforms;
    material.onBeforeCompile = (shader) => {
      Object.assign(shader.uniforms, uniforms);
      shader.vertexShader = shader.vertexShader
        .replace('#include <common>', `#include <common>
          attribute float aHeight;
          attribute float aGlow;
          uniform float uBaseH;
          uniform float uDir;
          varying float vGlow;
          varying float vBarY;`)
        .replace('#include <begin_vertex>', `#include <begin_vertex>
          ${DISPLACE}
          vGlow = aGlow;
          vBarY = transformed.y;`);
      shader.fragmentShader = shader.fragmentShader
        .replace('#include <common>', `#include <common>
          uniform float uDir;
          uniform vec3 uDeep;
          uniform float uDeepAmount;
          uniform float uDepthRange;
          varying float vGlow;
          varying float vBarY;`)
        .replace('#include <color_fragment>', `#include <color_fragment>
          float contact = mix(0.6, 1.0, smoothstep(0.0, 0.5, abs(vBarY)));
          diffuseColor.rgb *= contact;
          float depthFade = uDir < 0.0 ? smoothstep(0.0, uDepthRange, -vBarY) : 0.0;
          diffuseColor.rgb = mix(diffuseColor.rgb, uDeep, depthFade * uDeepAmount);`)
        .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
          totalEmissiveRadiance += diffuseColor.rgb * vGlow;`);
    };
    material.customProgramCacheKey = () => 'wu-bar';
    return material;
  }

  function makeDepthMaterial(dir) {
    const uniforms = { uBaseH: { value: BAR_BASE_H }, uDir: { value: dir } };
    const material = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking });
    material.onBeforeCompile = (shader) => {
      Object.assign(shader.uniforms, uniforms);
      shader.vertexShader = shader.vertexShader
        .replace('#include <common>', `#include <common>
          attribute float aHeight;
          uniform float uBaseH;
          uniform float uDir;`)
        .replace('#include <begin_vertex>', `#include <begin_vertex>
          ${DISPLACE}`);
    };
    material.customProgramCacheKey = () => 'wu-bar-depth';
    return material;
  }

  const upMaterial = makeBarMaterial(1);
  const downMaterial = makeBarMaterial(-1);
  const upDepth = makeDepthMaterial(1);

  const plateMaterial = new THREE.MeshPhysicalMaterial({
    color: 0xffffff,
    metalness: 0,
    roughness: 0.2,
    transmission: 1,
    thickness: 0.35,
    ior: 1.42,
    clearcoat: 1,
    clearcoatRoughness: 0.08,
    attenuationDistance: 3,
    specularIntensity: 0.6
  });
  const catcherMaterial = new THREE.ShadowMaterial({ color: 0x0b1724, opacity: 0.2, transparent: true, depthWrite: false });
  const linesMaterial = new THREE.LineBasicMaterial({ transparent: true, opacity: 0.05, depthWrite: false });
  const edgeMaterial = new THREE.LineBasicMaterial({ transparent: true, opacity: 0.8, depthWrite: false });
  const sheetMaterial = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false });
  const sheetEdgeMaterial = new THREE.LineBasicMaterial({ transparent: true, opacity: 0, depthWrite: false });
  const ringMaterial = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false });

  const glowCanvas = document.createElement('canvas');
  glowCanvas.width = glowCanvas.height = 128;
  {
    const g = glowCanvas.getContext('2d');
    const gradient = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gradient.addColorStop(0, 'rgba(255,255,255,0.9)');
    gradient.addColorStop(0.45, 'rgba(255,255,255,0.35)');
    gradient.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gradient;
    g.fillRect(0, 0, 128, 128);
  }
  const glowTexture = new THREE.CanvasTexture(glowCanvas);
  const glowMaterial = new THREE.MeshBasicMaterial({ map: glowTexture, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide });

  // ---------- world objects (rebuilt per data set) ----------
  const world = new THREE.Group();
  scene.add(world);
  let bars = null;      // { up, down, n, pos: Float32Array(x,z), targetUp, targetDown, delay, hUp, hDown }
  let plateGroup = null;
  const sheet = new THREE.Group();
  const sheetPlane = new THREE.Mesh(new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), sheetMaterial);
  const sheetEdge = new THREE.LineLoop(new THREE.BufferGeometry(), sheetEdgeMaterial);
  sheet.add(sheetPlane, sheetEdge);
  sheet.renderOrder = 2;
  world.add(sheet);
  const markers = new THREE.Group();
  const ringTop = new THREE.Mesh(new THREE.RingGeometry(0.6, 0.66, 72).rotateX(-Math.PI / 2), ringMaterial);
  ringTop.position.y = PLATE_T / 2 + 0.004;
  const ringBottom = ringTop.clone();
  ringBottom.position.y = -(PLATE_T / 2 + 0.004);
  const glowTop = new THREE.Mesh(new THREE.PlaneGeometry(2.3, 2.3).rotateX(-Math.PI / 2), glowMaterial);
  glowTop.position.y = PLATE_T / 2 + 0.003;
  const glowBottom = glowTop.clone();
  glowBottom.position.y = -(PLATE_T / 2 + 0.003);
  markers.add(glowTop, glowBottom, ringTop, ringBottom);
  markers.renderOrder = 3;
  world.add(markers);

  const layout = { cols: 1, rows: 1, k: 0.1, H: 4, plateW: 2, plateD: 2, radius: 5 };
  const palette = { fetch: new THREE.Color(), pass: new THREE.Color(), other: new THREE.Color() };
  let result = null;
  let themeName = theme;
  let hoverId = -1;
  const anim = { start: 0, running: false };

  function heightFor(value) { return Math.max(MIN_BAR_H, value * layout.k); }

  function disposeBars() {
    if (!bars) return;
    world.remove(bars.up, bars.down);
    bars.up.geometry.dispose();
    bars.down.geometry.dispose();
    bars.up.dispose();
    bars.down.dispose();
    bars = null;
  }

  function buildPlate() {
    if (plateGroup) {
      world.remove(plateGroup);
      plateGroup.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
    }
    plateGroup = new THREE.Group();
    const { plateW, plateD, cols, rows } = layout;
    const plate = new THREE.Mesh(new RoundedBoxGeometry(plateW, PLATE_T, plateD, 3, 0.028), plateMaterial);
    plate.renderOrder = 1;
    const catcher = new THREE.Mesh(new THREE.PlaneGeometry(plateW, plateD).rotateX(-Math.PI / 2), catcherMaterial);
    catcher.position.y = PLATE_T / 2 + 0.0015;
    catcher.receiveShadow = true;
    const linePoints = [];
    const x0 = -cols * CELL / 2, z0 = -rows * CELL / 2;
    const y = PLATE_T / 2 + 0.002;
    for (let c = 0; c <= cols; c++) linePoints.push(x0 + c * CELL, y, z0, x0 + c * CELL, y, -z0);
    for (let r = 0; r <= rows; r++) linePoints.push(x0, y, z0 + r * CELL, -x0, y, z0 + r * CELL);
    const lineGeometry = new THREE.BufferGeometry();
    lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePoints, 3));
    const lines = new THREE.LineSegments(lineGeometry, linesMaterial);
    const ex = plateW / 2 - 0.012, ez = plateD / 2 - 0.012, ey = PLATE_T / 2 + 0.001;
    const edgeGeometry = new THREE.BufferGeometry();
    edgeGeometry.setAttribute('position', new THREE.Float32BufferAttribute([-ex, ey, -ez, ex, ey, -ez, ex, ey, ez, -ex, ey, ez], 3));
    const edge = new THREE.LineLoop(edgeGeometry, edgeMaterial);
    plateGroup.add(plate, catcher, lines, edge);
    world.add(plateGroup);

    sheetPlane.scale.set(plateW - 0.16, 1, plateD - 0.16);
    const hw = (plateW - 0.16) / 2, hd = (plateD - 0.16) / 2;
    sheetEdge.geometry.dispose();
    sheetEdge.geometry = new THREE.BufferGeometry();
    sheetEdge.geometry.setAttribute('position', new THREE.Float32BufferAttribute([-hw, 0, -hd, hw, 0, -hd, hw, 0, hd, -hw, 0, hd], 3));

    const R = layout.radius;
    const keyDir = new THREE.Vector3(-0.5, 1.25, 0.35).normalize();
    keyLight.position.copy(keyDir).multiplyScalar(R * 2.2);
    const cam = keyLight.shadow.camera;
    cam.left = -R * 1.1; cam.right = R * 1.1; cam.top = R * 1.1; cam.bottom = -R * 1.1;
    cam.near = 0.1; cam.far = R * 4.5;
    cam.updateProjectionMatrix();
    keyLight.shadow.mapSize.set(layout.cols > 12 ? 4096 : 2048, layout.cols > 12 ? 4096 : 2048);
    if (keyLight.shadow.map) { keyLight.shadow.map.dispose(); keyLight.shadow.map = null; }
    underLight.position.set(0.45, -1, -0.3).normalize().multiplyScalar(R * 2);
    upMaterial.userData.uniforms.uDepthRange.value = layout.H;
    downMaterial.userData.uniforms.uDepthRange.value = layout.H;
  }

  function buildBars() {
    disposeBars();
    const n = result.wanted.length;
    const segments = n > 150 ? 2 : 3;
    const base = new RoundedBoxGeometry(BAR_W, BAR_BASE_H, BAR_W, segments, BAR_RADIUS);
    const make = (geometry, material, castShadow) => {
      geometry.setAttribute('aHeight', new THREE.InstancedBufferAttribute(new Float32Array(n), 1));
      geometry.setAttribute('aGlow', new THREE.InstancedBufferAttribute(new Float32Array(n), 1));
      const mesh = new THREE.InstancedMesh(geometry, material, n);
      mesh.frustumCulled = false;
      mesh.castShadow = castShadow;
      mesh.receiveShadow = castShadow;
      if (castShadow) mesh.customDepthMaterial = upDepth;
      return mesh;
    };
    const up = make(base, upMaterial, true);
    const down = make(base.clone(), downMaterial, false);
    const pos = new Float32Array(n * 2);
    const delay = new Float32Array(n);
    const targetUp = new Float32Array(n);
    const targetDown = new Float32Array(n);
    const matrix = new THREE.Matrix4();
    let maxDist = 0.0001;
    for (let i = 0; i < n; i++) {
      const col = i % layout.cols;
      const row = Math.floor(i / layout.cols);
      const x = (col - (layout.cols - 1) / 2) * CELL;
      const z = ((layout.rows - 1) / 2 - row) * CELL;
      pos[i * 2] = x; pos[i * 2 + 1] = z;
      matrix.makeTranslation(x, 0, z);
      up.setMatrixAt(i, matrix);
      down.setMatrixAt(i, matrix);
      targetUp[i] = heightFor(result.wanted[i]);
      targetDown[i] = heightFor(result.unwanted[i]);
      maxDist = Math.max(maxDist, Math.hypot(x, z));
    }
    for (let i = 0; i < n; i++) delay[i] = TL.stagger * (Math.hypot(pos[i * 2], pos[i * 2 + 1]) / maxDist);
    up.setColorAt(0, palette.other);
    down.setColorAt(0, palette.other);
    world.add(up, down);
    bars = { up, down, n, pos, delay, targetUp, targetDown, hUp: new Float32Array(n), hDown: new Float32Array(n) };
  }

  function computeLayout(cols) {
    const n = result.wanted.length;
    layout.cols = Math.max(1, Math.min(cols, n));
    layout.rows = Math.ceil(n / layout.cols);
    const span = Math.max(layout.cols, layout.rows);
    layout.H = Math.min(9.5, Math.max(3.0, 0.4 * span + 1.5));
    layout.k = layout.H / VALUE_MAX;
    layout.plateW = layout.cols * CELL + PLATE_MARGIN * 2;
    layout.plateD = layout.rows * CELL + PLATE_MARGIN * 2;
    layout.radius = Math.hypot(layout.plateW / 2, layout.plateD / 2, layout.H);
    layout.maxUp = Math.max(...result.wanted) * layout.k;
    layout.maxDown = Math.max(...result.unwanted) * layout.k;
  }

  // ---------- frame state ----------
  const tmpColor = new THREE.Color();
  function colorFor(status, t) {
    tmpColor.copy(palette.other);
    if (status >= 1) tmpColor.lerp(palette.pass, smooth(clamp01((t - TL.pass) / TL.passDur)));
    if (status === 2) tmpColor.lerp(palette.fetch, smooth(clamp01((t - TL.fetch) / TL.fetchDur)));
    return tmpColor;
  }

  function applyFrame(now) {
    if (!bars) return;
    const t = anim.running ? now - anim.start : Infinity;
    applyFrameAt(t);
    if (anim.running && t > TL.end) anim.running = false;
  }

  function applyFrameAt(t) {
    const { up, down, n, delay, targetUp, targetDown, hUp, hDown } = bars;
    const aUp = up.geometry.attributes.aHeight.array;
    const aDown = down.geometry.attributes.aHeight.array;
    const gUp = up.geometry.attributes.aGlow.array;
    const gDown = down.geometry.attributes.aGlow.array;
    const fetchProgress = clamp01((t - TL.fetch) / 900);
    const pulse = Number.isFinite(t) ? Math.sin(Math.PI * fetchProgress) * 0.55 : 0;
    for (let i = 0; i < n; i++) {
      const grow = easeOutCubic(clamp01((t - delay[i]) / TL.grow));
      hUp[i] = targetUp[i] * grow;
      hDown[i] = targetDown[i] * grow;
      aUp[i] = hUp[i];
      aDown[i] = hDown[i];
      const status = result.status[i];
      const c = colorFor(status, t);
      up.setColorAt(i, c);
      down.setColorAt(i, c);
      let glow = 0;
      if (status === 2) glow = 0.16 * smooth(clamp01((t - TL.fetch) / TL.fetchDur)) + pulse;
      else if (status === 1) glow = 0.025 * smooth(clamp01((t - TL.pass) / TL.passDur));
      if (i === hoverId) glow += 0.22;
      gUp[i] = glow;
      gDown[i] = glow * 0.8;
    }
    up.geometry.attributes.aHeight.needsUpdate = true;
    down.geometry.attributes.aHeight.needsUpdate = true;
    up.geometry.attributes.aGlow.needsUpdate = true;
    down.geometry.attributes.aGlow.needsUpdate = true;
    up.instanceColor.needsUpdate = true;
    down.instanceColor.needsUpdate = true;

    const th = SCENE_THEMES[themeName];
    const sheetIn = easeOutCubic(clamp01((t - TL.sheet) / TL.sheetDur));
    sheet.position.y = result.threshold * layout.k * sheetIn;
    sheet.visible = sheetIn > 0;
    sheetFade.base = th.sheetOpacity * clamp01((t - TL.sheet) / 220);
    sheetMaterial.opacity = sheetFade.base * sheetFade.view;
    sheetEdgeMaterial.opacity = 0.75 * clamp01((t - TL.sheet) / 220);

    const fx = bars.pos[result.fetch * 2], fz = bars.pos[result.fetch * 2 + 1];
    markers.position.set(fx, 0, fz);
    const ringIn = easeOutCubic(clamp01((t - TL.fetch) / 420));
    ringMaterial.opacity = 0.95 * ringIn;
    const ringScale = 0.72 + 0.28 * ringIn;
    ringTop.scale.setScalar(ringScale);
    ringBottom.scale.setScalar(ringScale);
    glowMaterial.opacity = (themeName === 'dark' ? 0.5 : 0.34) * ringIn + (Number.isFinite(t) ? Math.sin(Math.PI * fetchProgress) * 0.3 : 0);
    markers.visible = ringIn > 0;

    labelState.fetch = t >= TL.label;
    labelState.threshold = t >= TL.sheet + TL.sheetDur;
  }

  // the sheet tints everything below it when seen from straight above, so thin it out there
  const sheetFade = { base: 0, view: 1 };
  function updateSheetFade() {
    const d = camera.position.distanceTo(controls.target) || 1;
    const elevation = Math.abs(camera.position.y - controls.target.y) / d;
    sheetFade.view = 1 - 0.7 * smooth(clamp01((elevation - 0.72) / 0.26));
    sheetMaterial.opacity = sheetFade.base * sheetFade.view;
  }

  // ---------- labels ----------
  const labelState = { fetch: false, threshold: false };
  const projected = new THREE.Vector3();
  function placeTag(el, x, y, z, show, anchor, centerNdcX) {
    projected.set(x, y, z).project(camera);
    if (centerNdcX !== undefined) projected.x = centerNdcX;
    const visible = show && projected.z < 1 && Math.abs(projected.x) < 1.15 && Math.abs(projected.y) < 1.15;
    el.classList.toggle('is-shown', visible);
    if (!visible) return null;
    const w = window.innerWidth, h = window.innerHeight;
    const sx = (projected.x * 0.5 + 0.5) * w;
    const sy = (-projected.y * 0.5 + 0.5) * h;
    const ew = el.offsetWidth, eh = el.offsetHeight;
    let left, top;
    if (anchor === 'below') { left = sx - ew / 2; top = sy + 8; }
    else if (anchor === 'corner') { left = sx - ew - 10; top = sy - eh / 2; if (left < 8) left = sx + 10; }
    else { left = sx - ew / 2; top = sy - eh - 8; }
    left = Math.min(Math.max(6, left), w - ew - 6);
    top = Math.min(Math.max(6, top), h - eh - 6);
    el.style.transform = `translate(${left.toFixed(1)}px, ${top.toFixed(1)}px)`;
    return { left, top, right: left + ew, bottom: top + eh };
  }
  const overlaps = (a, b) => a && b && a.left < b.right + 4 && b.left < a.right + 4 && a.top < b.bottom + 4 && b.top < a.bottom + 4;
  function updateTags() {
    if (!bars) return;
    const fx = bars.pos[result.fetch * 2], fz = bars.pos[result.fetch * 2 + 1];
    // anchor the fetch label above the screen-space top of the bar's top face
    const topY = bars.hUp[result.fetch] + 0.02;
    const half = BAR_W / 2;
    let anchorX = fx, anchorZ = fz, highest = -Infinity, sumX = 0;
    for (const [cx, cz] of [[fx - half, fz - half], [fx + half, fz - half], [fx + half, fz + half], [fx - half, fz + half]]) {
      projected.set(cx, topY, cz).project(camera);
      sumX += projected.x;
      if (projected.y > highest) { highest = projected.y; anchorX = cx; anchorZ = cz; }
    }
    const fetchBox = placeTag(els.tagFetch, anchorX, topY, anchorZ, labelState.fetch, 'above', sumX / 4);
    let riskBox = placeTag(els.tagRisk, fx, -bars.hDown[result.fetch] - 0.05, fz, labelState.fetch && activeView !== 'top', 'below');
    if (overlaps(fetchBox, riskBox)) { els.tagRisk.classList.remove('is-shown'); riskBox = null; }
    // pin the threshold label to whichever sheet corner is furthest left on screen
    const hx = (layout.plateW - 0.16) / 2, hz = (layout.plateD - 0.16) / 2;
    let cornerX = -hx, cornerZ = hz, leftmost = Infinity;
    for (const [cx, cz] of [[-hx, -hz], [hx, -hz], [hx, hz], [-hx, hz]]) {
      projected.set(cx, sheet.position.y, cz).project(camera);
      if (projected.x < leftmost) { leftmost = projected.x; cornerX = cx; cornerZ = cz; }
    }
    const thrBox = placeTag(els.tagThr, cornerX, sheet.position.y, cornerZ, labelState.threshold && activeView !== 'top', 'corner');
    if (overlaps(thrBox, fetchBox) || overlaps(thrBox, riskBox)) els.tagThr.classList.remove('is-shown');
  }
  function refreshText() {
    if (!result) return;
    els.tagFetch.lastElementChild.textContent = t('tagFetch', { id: result.fetch });
    els.tagRisk.lastElementChild.textContent = t('tagRisk', { u: result.unwanted[result.fetch] });
    els.tagThr.lastElementChild.textContent = t('tagThr', { t: fmtThreshold(result.threshold) });
    if (hoverId >= 0) renderTooltip(hoverId);
    requestRender();
  }

  // ---------- camera ----------
  const controls = new OrbitControls(camera, els.canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.085;
  controls.rotateSpeed = 0.75;
  controls.zoomSpeed = 0.9;
  controls.minPolarAngle = 0.0005;
  controls.maxPolarAngle = Math.PI - 0.0005;
  controls.autoRotateSpeed = 0.9;
  controls.target.set(0, 0, 0);

  let activeView = 'angle';
  let tween = null;
  const spherical = new THREE.Spherical();
  const viewOffset = { x: 0, y: 0 };

  // Parts of the window not covered by panels; the model is framed inside the
  // candidate rectangle that lets it appear largest.
  let collapsedReadoutTop = null;
  function freeAreas() {
    const w = window.innerWidth, h = window.innerHeight;
    const introBottom = document.querySelector('.how summary').getBoundingClientRect().bottom;
    const dock = document.querySelector('.dock').getBoundingClientRect();
    if (smallScreen.matches) {
      // keep the framing of the collapsed readout so opening the details does not shrink the model
      if (!els.readout.classList.contains('is-open') || collapsedReadoutTop === null) {
        collapsedReadoutTop = els.readout.getBoundingClientRect().top;
      }
      const top = Math.min(collapsedReadoutTop, dock.top);
      return [{ x0: 6, x1: w - 6, y0: introBottom + 8, y1: Math.max(introBottom + 140, top - 8) }];
    }
    const readout = els.readout.getBoundingClientRect();
    const views = document.querySelector('.views').getBoundingClientRect();
    const x1 = readout.left - 24, y0 = introBottom + 14;
    const bottomTop = Math.min(dock.top, views.top) - 14;
    return [
      { x0: 28, x1, y0, y1: bottomTop },
      { x0: dock.right + 20, x1, y0, y1: h - 20 },
      // tall windows (tablets in portrait): the full width below the readout
      { x0: 28, x1: w - 28, y0: Math.max(y0, readout.bottom + 14), y1: bottomTop }
    ].filter((a) => a.x1 - a.x0 > 160 && a.y1 - a.y0 > 160);
  }

  const probe = new THREE.PerspectiveCamera();
  const corner = new THREE.Vector3();
  const lookDir = new THREE.Vector3();
  function modelCorners() {
    const hw = layout.plateW / 2, hd = layout.plateD / 2;
    const top = layout.maxUp + 0.45, bottom = -(layout.maxDown + 0.45);
    const points = [];
    for (const x of [-hw, hw]) for (const y of [bottom, top]) for (const z of [-hd, hd]) points.push(new THREE.Vector3(x, y, z));
    return points;
  }

  // Find the camera distance (and screen offset) that fits the model's projected
  // bounding box inside the free area for a given viewing direction.
  function solveFrame(theta, phi) {
    const w = window.innerWidth, h = window.innerHeight;
    probe.fov = camera.fov;
    probe.aspect = w / h;
    probe.near = 0.1;
    probe.far = 4000;
    probe.updateProjectionMatrix();
    lookDir.setFromSphericalCoords(1, phi, theta);
    const points = modelCorners();
    const measure = (distance) => {
      probe.position.copy(lookDir).multiplyScalar(distance);
      probe.lookAt(0, 0, 0);
      probe.updateMatrixWorld(true);
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity, clipped = false;
      for (const p of points) {
        corner.copy(p).project(probe);
        if (corner.z > 1 || corner.z < -1) clipped = true;
        const px = (corner.x + 1) / 2 * w, py = (1 - corner.y) / 2 * h;
        minX = Math.min(minX, px); maxX = Math.max(maxX, px);
        minY = Math.min(minY, py); maxY = Math.max(maxY, py);
      }
      return { minX, maxX, minY, maxY, clipped };
    };
    let best = null;
    const areas = freeAreas();
    if (!areas.length) areas.push({ x0: 0, x1: w, y0: 0, y1: h });
    for (const area of areas) {
      const fitW = Math.max(120, area.x1 - area.x0), fitH = Math.max(120, area.y1 - area.y0);
      let lo = 0.5, hi = 1000;
      for (let i = 0; i < 40; i++) {
        const mid = (lo + hi) / 2;
        const b = measure(mid);
        if (!b.clipped && b.maxX - b.minX <= fitW && b.maxY - b.minY <= fitH) hi = mid; else lo = mid;
      }
      if (best && best.radius <= hi) continue;
      const b = measure(hi);
      best = {
        radius: hi,
        x: (b.minX + b.maxX) / 2 - (area.x0 + area.x1) / 2,
        y: (b.minY + b.maxY) / 2 - (area.y0 + area.y1) / 2
      };
    }
    return best;
  }

  function applyViewOffset() {
    const w = window.innerWidth, h = window.innerHeight;
    camera.setViewOffset(w, h, viewOffset.x, viewOffset.y, w, h);
    camera.updateProjectionMatrix();
  }

  function startTween(theta, phi, frame, duration) {
    spherical.setFromVector3(camera.position.clone().sub(controls.target));
    const fromTheta = spherical.theta;
    const delta = Math.atan2(Math.sin(theta - fromTheta), Math.cos(theta - fromTheta));
    const instant = reduceMotion.matches || duration <= 0;
    tween = {
      start: performance.now(), duration: instant ? 1 : duration,
      from: { theta: fromTheta, phi: spherical.phi, radius: spherical.radius, target: controls.target.clone(), x: viewOffset.x, y: viewOffset.y },
      to: { theta: fromTheta + delta, phi, radius: frame.radius, target: new THREE.Vector3(0, 0, 0), x: frame.x, y: frame.y }
    };
    if (instant) stepTween(tween.start + 1);
    requestRender();
  }

  function stepTween(now) {
    const p = clamp01((now - tween.start) / tween.duration);
    const e = easeInOutCubic(p);
    const lerp = (a, b) => a + (b - a) * e;
    controls.target.lerpVectors(tween.from.target, tween.to.target, e);
    spherical.set(lerp(tween.from.radius, tween.to.radius), lerp(tween.from.phi, tween.to.phi), lerp(tween.from.theta, tween.to.theta));
    camera.position.setFromSpherical(spherical).add(controls.target);
    camera.lookAt(controls.target);
    viewOffset.x = lerp(tween.from.x, tween.to.x);
    viewOffset.y = lerp(tween.from.y, tween.to.y);
    applyViewOffset();
    if (p >= 1) tween = null;
  }

  function goToView(name, duration = 950) {
    activeView = name;
    setActiveView(name);
    const v = VIEWS[name];
    startTween(v.theta, v.phi, solveFrame(v.theta, v.phi), duration);
  }

  function reframe(duration) {
    if (activeView) { goToView(activeView, duration); return; }
    spherical.setFromVector3(camera.position.clone().sub(controls.target));
    startTween(spherical.theta, spherical.phi, solveFrame(spherical.theta, spherical.phi), duration);
  }

  controls.addEventListener('start', () => {
    tween = null;
    if (activeView) { activeView = null; setActiveView(null); }
    hideTooltip();
  });
  controls.addEventListener('change', requestRender);

  // ---------- default angle that keeps the fetched candidate in sight ----------
  const visRay = new THREE.Ray();
  const visBox = new THREE.Box3();
  const visPoint = new THREE.Vector3();
  const visHit = new THREE.Vector3();
  const visCam = new THREE.Vector3();
  const visToward = new THREE.Vector3();
  function fetchVisibility(theta, phi) {
    const f = result.fetch;
    const fx = bars.pos[f * 2], fz = bars.pos[f * 2 + 1];
    const hu = bars.targetUp[f], hd = bars.targetDown[f];
    lookDir.setFromSphericalCoords(1, phi, theta);
    visCam.copy(lookDir).multiplyScalar(layout.radius * 3.2);
    visToward.set(lookDir.x, 0, lookDir.z).normalize().multiplyScalar(BAR_W / 2 - 0.02);
    const samples = [
      [fx, hu * 0.98, fz, 1, 1],
      [fx + visToward.x, hu * 0.75, fz + visToward.z, 1, 1],
      [fx + visToward.x, hu * 0.45, fz + visToward.z, 0.8, 1],
      [fx + visToward.x, -hd * 0.6, fz + visToward.z, 0.5, -1]
    ];
    const half = BAR_W / 2;
    let score = 0;
    for (const [px, py, pz, weight, side] of samples) {
      visPoint.set(px, py, pz);
      const distance = visCam.distanceTo(visPoint);
      visRay.origin.copy(visCam);
      visRay.direction.copy(visPoint).sub(visCam).normalize();
      let blocked = false;
      for (let i = 0; i < bars.n && !blocked; i++) {
        if (i === f) continue;
        const x = bars.pos[i * 2], z = bars.pos[i * 2 + 1];
        if (side > 0) { visBox.min.set(x - half, 0, z - half); visBox.max.set(x + half, bars.targetUp[i], z + half); }
        else { visBox.min.set(x - half, -bars.targetDown[i], z - half); visBox.max.set(x + half, 0, z + half); }
        if (visRay.intersectBox(visBox, visHit) && visHit.distanceTo(visCam) < distance - 0.05) blocked = true;
      }
      if (!blocked) score += weight;
    }
    return score;
  }
  function chooseAngle() {
    const base = 0.66;
    let best = base, bestScore = -1;
    for (const theta of [base, base + Math.PI / 2, base - Math.PI / 2, base + Math.PI]) {
      const score = fetchVisibility(theta, VIEWS.angle.phi);
      if (score > bestScore + 1e-6) { bestScore = score; best = theta; }
    }
    VIEWS.angle.theta = best;
    VIEWS.below.theta = best;
  }

  // ---------- picking ----------
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  const box = new THREE.Box3();
  const hitPoint = new THREE.Vector3();
  function pick(clientX, clientY) {
    if (!bars) return -1;
    pointer.set((clientX / window.innerWidth) * 2 - 1, -(clientY / window.innerHeight) * 2 + 1);
    raycaster.setFromCamera(pointer, camera);
    const ray = raycaster.ray;
    let best = -1, bestDistance = Infinity;
    const half = BAR_W / 2;
    for (let i = 0; i < bars.n; i++) {
      const x = bars.pos[i * 2], z = bars.pos[i * 2 + 1];
      box.min.set(x - half, 0, z - half);
      box.max.set(x + half, Math.max(bars.hUp[i], 0.02), z + half);
      if (ray.intersectBox(box, hitPoint)) {
        const d = hitPoint.distanceToSquared(ray.origin);
        if (d < bestDistance) { bestDistance = d; best = i; }
      }
      box.min.set(x - half, -Math.max(bars.hDown[i], 0.02), z - half);
      box.max.set(x + half, 0, z + half);
      if (ray.intersectBox(box, hitPoint)) {
        const d = hitPoint.distanceToSquared(ray.origin);
        if (d < bestDistance) { bestDistance = d; best = i; }
      }
    }
    return best;
  }

  let pointerScreen = { x: 0, y: 0 };
  let pickQueued = false;
  function setHover(id) {
    if (id === hoverId) return;
    hoverId = id;
    els.canvas.classList.toggle('is-hovering', id >= 0);
    if (id >= 0) renderTooltip(id); else hideTooltip();
    applyFrame(performance.now());
    requestRender();
  }
  els.canvas.addEventListener('pointermove', (event) => {
    if (event.pointerType !== 'mouse' || event.buttons) return;
    pointerScreen = { x: event.clientX, y: event.clientY };
    if (pickQueued) return;
    pickQueued = true;
    requestAnimationFrame(() => {
      pickQueued = false;
      setHover(pick(pointerScreen.x, pointerScreen.y));
      if (hoverId >= 0) positionTooltip(pointerScreen.x, pointerScreen.y);
    });
  });
  els.canvas.addEventListener('pointerleave', () => setHover(-1));
  let downAt = null;
  els.canvas.addEventListener('pointerdown', (event) => { downAt = { x: event.clientX, y: event.clientY, time: performance.now() }; });
  els.canvas.addEventListener('pointerup', (event) => {
    if (!downAt || event.pointerType === 'mouse') return;
    const moved = Math.hypot(event.clientX - downAt.x, event.clientY - downAt.y);
    if (moved < 8 && performance.now() - downAt.time < 400) {
      const id = pick(event.clientX, event.clientY);
      pointerScreen = { x: event.clientX, y: event.clientY };
      setHover(id === hoverId ? -1 : id);
      if (hoverId >= 0) positionTooltip(event.clientX, event.clientY);
    }
    downAt = null;
  });

  // ---------- render loop ----------
  let dirty = true;
  function requestRender() { dirty = true; }

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    applyViewOffset();
    requestRender();
  }
  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    resize();
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (result) reframe(0); }, 60);
  });

  function tick(now) {
    requestAnimationFrame(tick);
    let changed = false;
    if (tween) { stepTween(now); changed = true; }
    else if (controls.update()) changed = true;
    if (anim.running) { applyFrame(now); changed = true; }
    if (changed || dirty) {
      dirty = false;
      updateSheetFade();
      renderer.render(scene, camera);
      updateTags();
    }
  }

  // ---------- theme ----------
  function drawBackdrop(colors) {
    const g = bgCanvas.getContext('2d');
    const gradient = g.createLinearGradient(0, 0, 0, bgCanvas.height);
    gradient.addColorStop(0, colors[0]);
    gradient.addColorStop(0.52, colors[1]);
    gradient.addColorStop(1, colors[2]);
    g.fillStyle = gradient;
    g.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
    bgTexture.needsUpdate = true;
  }

  function setTheme(name) {
    themeName = name;
    const th = SCENE_THEMES[name];
    drawBackdrop(th.bg);
    palette.fetch.set(th.fetch);
    palette.pass.set(th.pass);
    palette.other.set(th.other);
    hemi.color.set(th.hemiSky);
    hemi.groundColor.set(th.hemiGround);
    hemi.intensity = th.hemi;
    keyLight.color.set(th.keyColor);
    keyLight.intensity = th.key;
    underLight.color.set(th.underColor);
    underLight.intensity = th.under;
    scene.environmentIntensity = th.env;
    plateMaterial.color.set(th.plate);
    plateMaterial.attenuationColor.set(th.attenuation);
    plateMaterial.roughness = th.plateRough;
    catcherMaterial.opacity = th.shadow;
    linesMaterial.color.set(th.lines);
    linesMaterial.opacity = th.linesOpacity;
    edgeMaterial.color.set(th.edge);
    edgeMaterial.opacity = th.edgeOpacity;
    sheetMaterial.color.set(th.pass);
    sheetEdgeMaterial.color.set(th.pass);
    ringMaterial.color.set(th.fetch);
    glowMaterial.color.set(th.fetch);
    for (const m of [upMaterial, downMaterial]) {
      m.userData.uniforms.uDeep.value.set(th.deep);
      m.userData.uniforms.uDeepAmount.value = th.deepAmount;
    }
    applyFrame(anim.running ? performance.now() : Infinity);
    requestRender();
  }

  // ---------- data ----------
  function setData(nextResult, cols, { reframe: shouldReframe = false, intro = false } = {}) {
    result = nextResult;
    hoverId = -1;
    hideTooltip();
    computeLayout(cols);
    buildPlate();
    buildBars();
    chooseAngle();
    refreshText();
    replay();
    if (intro) {
      const v = VIEWS.angle;
      const frame = solveFrame(v.theta, v.phi);
      viewOffset.x = frame.x;
      viewOffset.y = frame.y;
      applyViewOffset();
      spherical.set(frame.radius * (reduceMotion.matches ? 1 : 1.25), v.phi + (reduceMotion.matches ? 0 : 0.1), v.theta - (reduceMotion.matches ? 0 : 0.55));
      camera.position.setFromSpherical(spherical);
      camera.lookAt(0, 0, 0);
      activeView = 'angle';
      setActiveView('angle');
      startTween(v.theta, v.phi, frame, 2400);
    } else if (shouldReframe) {
      reframe(800);
    }
  }

  function replay() {
    anim.start = performance.now();
    anim.running = !reduceMotion.matches;
    labelState.fetch = false;
    labelState.threshold = false;
    applyFrame(anim.running ? anim.start : Infinity);
    requestRender();
  }

  function setAutoRotate(on) {
    controls.autoRotate = on;
    requestRender();
  }

  function layoutChanged() {
    requestRender();
  }

  resize();
  setTheme(themeName);
  requestAnimationFrame(tick);
  if (new URLSearchParams(location.search).has('debug')) {
    window.__wu = { THREE, scene, camera, renderer, controls, keyLight, catcherMaterial, plateMaterial, get bars() { return bars; }, layout, requestRender, freezeAt(ms) { anim.running = false; applyFrameAt(ms); requestRender(); } };
  }

  return { setData, setTheme, replay, goToView, setAutoRotate, refreshText, layoutChanged };
}

// ---------- tooltip ----------
function renderTooltip(id) {
  const r = state.result;
  if (!r || id < 0) return;
  const st = r.status[id];
  const keyClass = st === 2 ? 'key-fetch' : st === 1 ? 'key-pass' : 'key-other';
  let note;
  if (st === 2) note = t('tipFetch', { d: fmtInt(r.distance.get(id)), k: r.considered.length });
  else if (st === 1) note = t('tipPass', { d: fmtInt(r.distance.get(id)), r: r.rank.get(id), k: r.considered.length });
  else note = t('tipOther');
  els.tooltip.innerHTML = `<div class="tt-title"><span class="key ${keyClass}"></span>${t('tipCandidate', { id })}</div>`
    + `<div class="tt-scores"><span>${t('tipWanted')} <b>${r.wanted[id]}</b></span><span>${t('tipRisk')} <b>${r.unwanted[id]}</b></span></div>`
    + `<div class="tt-note">${note}</div>`;
  els.tooltip.hidden = false;
}
function positionTooltip(x, y) {
  const tip = els.tooltip;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let left = x + 16, top = y + 16;
  if (left + w > window.innerWidth - 8) left = x - w - 16;
  if (top + h > window.innerHeight - 8) top = y - h - 16;
  tip.style.transform = `translate(${Math.max(8, left)}px, ${Math.max(8, top)}px)`;
}
function hideTooltip() { els.tooltip.hidden = true; }

function showSceneError() {
  els.sceneError.textContent = t('sceneError');
  els.sceneError.hidden = false;
}

scene3d = await initScene();
if (scene3d) scene3d.setData(state.result, state.cols, { intro: true });
</script>
